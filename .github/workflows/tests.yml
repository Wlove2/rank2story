name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Verify release and locked-production source hashes
        run: python examples/verify_source_manifest.py
      - name: Report optional live-collection prerequisites (offline)
        run: python examples/check_installation.py --json
      - name: Run offline synthetic integration demo
        run: python examples/run_synthetic_demo.py
      - name: Run synthetic source-to-freeze-to-candidate integration
        run: python examples/run_synthetic_scan_to_candidate.py
      - name: Run regression suite
        run: python -m pytest -q --disable-warnings --tb=short
      - name: Verify recovery, variant and unified policy switching (offline)
        run: python -m unittest discover -s examples -p "test_*.py" -q
      - name: Inspect default A/B/C policy (no model call)
        run: python scripts/candidate.py config
