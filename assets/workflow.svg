<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="680" viewBox="0 0 1570 680" role="img" aria-labelledby="title desc">
<title id="title">Rank2Story · 从市场信号到故事选题</title>
<desc id="desc">从网文排行榜与读者反馈出发，沿 A/B/C 多路线设计故事，独立审查后形成候选故事卡。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCFDFE"/><stop offset="1" stop-color="#F7F9FD"/></linearGradient><filter id="shade" x="-12%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#35445a" flood-opacity=".065"/></filter></defs>
<rect width="1570" height="680" fill="url(#bg)"/>
<g font-family="system-ui,-apple-system,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="64" y="84" fill="#132441" font-size="46" font-weight="750" >从市场信号，到一个好故事</text>
<text x="64" y="129" fill="#63758d" font-size="23" font-weight="400" >从七个平台发现读者关心的题材，再把灵感打磨成可以继续写的选题。</text>
<text x="1507" y="78" fill="#6682a1" font-size="21" font-weight="800" text-anchor="end" letter-spacing="2">RANK2STORY</text>
<rect x="64" y="188" width="446" height="363" rx="24" fill="#ffffff" stroke="#DDE6F0" stroke-width="1.4" filter="url(#shade)"/>
<path d="M92 188 H482" stroke="#386FC2" stroke-width="4" stroke-linecap="round"/>
<rect x="92" y="225" width="66" height="47" rx="14" fill="#EAF2FF"/>
<text x="125" y="256" fill="#386FC2" font-size="23" font-weight="750" text-anchor="middle">01</text>
<text x="174" y="255" fill="#386FC2" font-size="22" font-weight="700" >DISCOVER</text>
<text x="93" y="337" fill="#162944" font-size="37" font-weight="750" >观察市场</text>
<text x="93" y="387" fill="#51677e" font-size="23" font-weight="400" >热门题材有哪些？</text>
<text x="93" y="426" fill="#51677e" font-size="23" font-weight="400" >读者最近在找什么、讨论什么？</text>
<rect x="93" y="467" width="127" height="49" rx="15" fill="#EAF2FF"/>
<text x="156.5" y="499" fill="#386FC2" font-size="21" font-weight="650" text-anchor="middle">七个平台</text>
<rect x="233" y="467" width="150" height="49" rx="15" fill="#EAF2FF"/>
<text x="308" y="499" fill="#386FC2" font-size="21" font-weight="650" text-anchor="middle">榜单与社区</text>
<rect x="562" y="188" width="446" height="363" rx="24" fill="#ffffff" stroke="#DDE6F0" stroke-width="1.4" filter="url(#shade)"/>
<path d="M590 188 H980" stroke="#7B58B3" stroke-width="4" stroke-linecap="round"/>
<rect x="590" y="225" width="66" height="47" rx="14" fill="#F2EDFC"/>
<text x="623" y="256" fill="#7B58B3" font-size="23" font-weight="750" text-anchor="middle">02</text>
<text x="672" y="255" fill="#7B58B3" font-size="22" font-weight="700" >CREATE</text>
<text x="591" y="337" fill="#162944" font-size="37" font-weight="750" >探索故事</text>
<text x="591" y="387" fill="#51677e" font-size="23" font-weight="400" >相同题材，也能写出不同方向。</text>
<text x="591" y="426" fill="#51677e" font-size="23" font-weight="400" >从开篇、冲突到情节回报。</text>
<rect x="591" y="467" width="127" height="49" rx="15" fill="#F2EDFC"/>
<text x="654.5" y="499" fill="#7B58B3" font-size="21" font-weight="650" text-anchor="middle">A 路线</text>
<rect x="731" y="467" width="127" height="49" rx="15" fill="#F2EDFC"/>
<text x="794.5" y="499" fill="#7B58B3" font-size="21" font-weight="650" text-anchor="middle">B 路线</text>
<rect x="871" y="467" width="127" height="49" rx="15" fill="#F2EDFC"/>
<text x="934.5" y="499" fill="#7B58B3" font-size="21" font-weight="650" text-anchor="middle">C 路线</text>
<rect x="1060" y="188" width="446" height="363" rx="24" fill="#ffffff" stroke="#DDE6F0" stroke-width="1.4" filter="url(#shade)"/>
<path d="M1088 188 H1478" stroke="#258B74" stroke-width="4" stroke-linecap="round"/>
<rect x="1088" y="225" width="66" height="47" rx="14" fill="#E7F6F0"/>
<text x="1121" y="256" fill="#258B74" font-size="23" font-weight="750" text-anchor="middle">03</text>
<text x="1170" y="255" fill="#258B74" font-size="22" font-weight="700" >REFINE</text>
<text x="1089" y="337" fill="#162944" font-size="37" font-weight="750" >筛选好故事</text>
<text x="1089" y="387" fill="#51677e" font-size="23" font-weight="400" >检查原创性、市场适配与逻辑。</text>
<text x="1089" y="426" fill="#51677e" font-size="23" font-weight="400" >留下能继续写下去的候选卡。</text>
<rect x="1089" y="467" width="127" height="49" rx="15" fill="#E7F6F0"/>
<text x="1152.5" y="499" fill="#258B74" font-size="21" font-weight="650" text-anchor="middle">独立审查</text>
<rect x="1229" y="467" width="127" height="49" rx="15" fill="#E7F6F0"/>
<text x="1292.5" y="499" fill="#258B74" font-size="21" font-weight="650" text-anchor="middle">候选组合</text>
<path d="M513 373 H548 M537 362 L548 373 L537 384" fill="none" stroke="#9AADC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1011 373 H1046 M1035 362 L1046 373 L1035 384" fill="none" stroke="#9AADC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M64 598 H1506" fill="none" stroke="#e2e9f2" stroke-width="2"/>
<text x="65" y="635" fill="#657b93" font-size="21" font-weight="500" >来源可追溯</text>
<text x="251" y="635" fill="#bac7d5" font-size="23" font-weight="500" >·</text>
<text x="282" y="635" fill="#657b93" font-size="21" font-weight="500" >多路线构思</text>
<text x="477" y="635" fill="#bac7d5" font-size="23" font-weight="500" >·</text>
<text x="508" y="635" fill="#657b93" font-size="21" font-weight="500" >市场与原创性双审</text>
<text x="768" y="635" fill="#bac7d5" font-size="23" font-weight="500" >·</text>
<text x="799" y="635" fill="#657b93" font-size="21" font-weight="500" >运行可恢复</text>
<text x="1505" y="635" fill="#9daec1" font-size="18" font-weight="600" text-anchor="end" letter-spacing=".7">3 SKILLS  ·  PYTHON WORKFLOW</text>
</g></svg>
